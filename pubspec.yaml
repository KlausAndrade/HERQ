name: gym_ai
description: "A mobile-first workout tracker with AI coaching capabilities"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  hooks_riverpod: ^2.4.9
  flutter_hooks: ^0.20.3
  
  # Navigation
  go_router: ^12.1.3
  
  # Database & Persistence
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.15
  path_provider: ^2.1.1
  path: ^1.8.3
  shared_preferences: ^2.2.2
  
  # Networking & Sync
  http: ^1.1.0
  supabase_flutter: ^2.10.2
  connectivity_plus: ^5.0.2
  
  # Charts & Visualization
  fl_chart: ^0.65.0
  
  # UI & Theming
  intl: any
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  image_picker: ^1.0.7
  share_plus: ^7.2.1
  flutter_image_compress: ^2.1.0
  
  # Utilities
  uuid: ^4.2.1
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  
  # Environment
  flutter_dotenv: ^5.1.0
  
  # Notifications & Background
  flutter_local_notifications: ^16.3.0
  workmanager: ^0.5.2
  
  # Accessibility & Platform
  vibration: ^1.8.4
  wakelock_plus: ^1.1.4
  live_activities: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  drift_dev: ^2.14.1
  json_serializable: ^6.7.1
  
  # Testing
  mocktail: ^1.0.2
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
    - .env