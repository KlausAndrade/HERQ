<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HERQ Web Diagnostic</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #141516;
            color: #F8F8FA;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #00BFA6;
        }
        .status {
            background: #1B1D21;
            border: 1px solid #00BFA6;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
        }
        .success {
            color: #00BFA6;
        }
        .error {
            color: #D4FF4D;
        }
        .log {
            background: #0a0a0a;
            border-radius: 4px;
            padding: 12px;
            margin: 8px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            background: #00BFA6;
            color: #1B1D21;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin: 8px 8px 8px 0;
        }
        button:hover {
            background: #00D4B8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 HERQ Web Diagnostic</h1>
        
        <div class="status">
            <h2>System Status</h2>
            <div id="status"></div>
        </div>

        <div class="status">
            <h2>Actions</h2>
            <button onclick="checkStorage()">Check Storage</button>
            <button onclick="clearStorage()">Clear Storage</button>
            <button onclick="testSupabase()">Test Supabase</button>
            <button onclick="location.reload()">Reload Page</button>
            <button onclick="location.href='/'">Go to App</button>
        </div>

        <div class="status">
            <h2>Console Logs</h2>
            <div id="logs" class="log"></div>
        </div>
    </div>

    <script>
        const logs = [];
        const logEl = document.getElementById('logs');
        const statusEl = document.getElementById('status');

        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            logs.push(logMessage);
            logEl.innerHTML = logs.map(log => log.replace(/\n/g, '<br>')).join('<br>');
            logEl.scrollTop = logEl.scrollHeight;
            console.log(message);
        }

        function updateStatus(html) {
            statusEl.innerHTML = html;
        }

        // Override console methods to capture logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function(...args) {
            addLog(args.join(' '), 'log');
            originalLog.apply(console, args);
        };

        console.error = function(...args) {
            addLog('ERROR: ' + args.join(' '), 'error');
            originalError.apply(console, args);
        };

        console.warn = function(...args) {
            addLog('WARN: ' + args.join(' '), 'warn');
            originalWarn.apply(console, args);
        };

        // Check system status
        function checkStatus() {
            let status = '<ul style="list-style: none; padding: 0;">';
            
            // Check JavaScript
            status += '<li class="success">✅ JavaScript: Working</li>';
            
            // Check localStorage
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                status += '<li class="success">✅ LocalStorage: Available</li>';
            } catch (e) {
                status += '<li class="error">❌ LocalStorage: Not available - ' + e.message + '</li>';
            }
            
            // Check sessionStorage
            try {
                sessionStorage.setItem('test', 'test');
                sessionStorage.removeItem('test');
                status += '<li class="success">✅ SessionStorage: Available</li>';
            } catch (e) {
                status += '<li class="error">❌ SessionStorage: Not available - ' + e.message + '</li>';
            }
            
            // Check fetch API
            if (typeof fetch !== 'undefined') {
                status += '<li class="success">✅ Fetch API: Available</li>';
            } else {
                status += '<li class="error">❌ Fetch API: Not available</li>';
            }
            
            // Check URL
            status += '<li>📍 Current URL: ' + window.location.href + '</li>';
            status += '<li>📍 Origin: ' + window.location.origin + '</li>';
            
            status += '</ul>';
            updateStatus(status);
        }

        function checkStorage() {
            addLog('Checking browser storage...');
            
            const localStorageKeys = Object.keys(localStorage);
            addLog(`LocalStorage has ${localStorageKeys.length} keys:`);
            localStorageKeys.forEach(key => {
                const value = localStorage.getItem(key);
                addLog(`  - ${key}: ${value.substring(0, 100)}${value.length > 100 ? '...' : ''}`);
            });
            
            const sessionStorageKeys = Object.keys(sessionStorage);
            addLog(`SessionStorage has ${sessionStorageKeys.length} keys:`);
            sessionStorageKeys.forEach(key => {
                const value = sessionStorage.getItem(key);
                addLog(`  - ${key}: ${value.substring(0, 100)}${value.length > 100 ? '...' : ''}`);
            });
        }

        function clearStorage() {
            if (confirm('Clear all browser storage? This will log you out.')) {
                localStorage.clear();
                sessionStorage.clear();
                addLog('✅ Storage cleared');
                alert('Storage cleared! Reloading...');
                location.reload();
            }
        }

        async function testSupabase() {
            addLog('Testing Supabase connection...');
            
            const url = 'https://vvgxvunvzhtvwvdvtlrm.supabase.co';
            
            try {
                const response = await fetch(url + '/rest/v1/', {
                    headers: {
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2Z3h2dW52emh0dnd2ZHZ0bHJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk3NDcyNzcsImV4cCI6MjA3NTMyMzI3N30.yOMUIA2sQSTjAjlFemz1GYCxNR0sVm4ZMMl_9Y2ABno'
                    }
                });
                
                if (response.ok) {
                    addLog('✅ Supabase connection successful');
                    addLog(`   Status: ${response.status}`);
                } else {
                    addLog(`⚠️ Supabase response status: ${response.status}`);
                }
            } catch (error) {
                addLog('❌ Supabase connection failed: ' + error.message);
            }
        }

        // Capture window errors
        window.addEventListener('error', function(event) {
            addLog('❌ Window Error: ' + event.message + ' at ' + event.filename + ':' + event.lineno);
        });

        window.addEventListener('unhandledrejection', function(event) {
            addLog('❌ Unhandled Promise Rejection: ' + event.reason);
        });

        // Run initial checks
        checkStatus();
        addLog('Diagnostic page loaded. Check the status above.');
    </script>
</body>
</html>
